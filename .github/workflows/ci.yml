name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # The documented full configuration: the toolkit and the optional Assistant, both installed.
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Confinement backend for the Assistant tests (Linux)
        if: runner.os == 'Linux'
        run: |
          # The Assistant's Linux jail is bubblewrap. Ubuntu runners do not ship it, and Ubuntu 24.04 restricts
          # unprivileged user namespaces through AppArmor; without both, the confinement tests would skip.
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid true && echo "bubblewrap usable"
      - name: Install the toolkit and the optional Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[html,test]" ./assistant
      - name: Select a reference OpenBLAS kernel where the CPU allows it (Linux)
        if: runner.os == 'Linux'
        run: |
          # The frozen reference values are reproduced bit for bit by the Cooperlake and SkylakeX kernels; AVX2 kernels
          # (Haswell, Zen) differ in trailing digits within the portable profile
          # (records/release/BLAS_KERNEL_NUMERICAL_DIFFERENCE.md). On AVX-512 runners, select SkylakeX so that the
          # bit-exact checks run; elsewhere the tests apply the portable profile.
          if grep -q avx512f /proc/cpuinfo; then echo "OPENBLAS_CORETYPE=SkylakeX" >> "$GITHUB_ENV"; fi
      - name: Platform record
        shell: bash
        run: |
          cpu=$( (grep -m1 "model name" /proc/cpuinfo 2>/dev/null || sysctl -n machdep.cpu.brand_string) | sed 's/.*: //')
          core=$(python -c "import sys; sys.path.insert(0, 'tests'); import _blas; print(_blas.openblas_core())")
          exact=$(python -c "import sys; sys.path.insert(0, 'tests'); import _blas; print(_blas.bit_exact_expected())")
          echo "::notice title=Platform::$(uname -sm) | CPU: $cpu | OpenBLAS kernel: $core | bit-exact reference expected: $exact"
      - name: CLI smoke tests
        run: |
          rnplens --version
          rnplens --help
          rnplens evaluate --help
          rnplens report --help
          rnplens diagnose --help
          rnplens provenance > /dev/null
          python -m rnplens_assistant --help
      - name: Numerical regression (portable profile)
        shell: bash
        run: |
          set +e
          rnplens selftest --profile portable > "$RUNNER_TEMP/selftest.txt" 2>&1; rc=$?
          cat "$RUNNER_TEMP/selftest.txt"
          if [ $rc -ne 0 ]; then
            grep -E "FAIL|deviation" "$RUNNER_TEMP/selftest.txt" | head -20 | while read -r l; do echo "::error title=selftest::$l"; done
          fi
          exit $rc
      - name: Core test suite
        if: success() || failure()
        run: python -m pytest -q -rs --junitxml="$RUNNER_TEMP/junit-core.xml"
      - name: Assistant test suite
        if: success() || failure()
        run: python -m pytest -q -rs --junitxml="$RUNNER_TEMP/junit-assistant.xml" assistant/tests
      - name: End-to-end examples
        if: success() || failure()
        run: bash examples/run_examples.sh "$RUNNER_TEMP/rnplens_examples"
      - name: Test counts
        if: always()
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          for path in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "junit-*.xml"))):
              root = ET.parse(path).getroot()
              s = root if root.tag == "testsuite" else root.find("testsuite")
              t, f, e, k = (int(s.get(x, 0)) for x in ("tests", "failures", "errors", "skipped"))
              suite = os.path.basename(path)[len("junit-"):-len(".xml")]
              print("::notice title=%s tests::%d passed, %d skipped, %d failed, %d errors" % (suite, t - f - e - k, k, f, e))
          PY
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          for path in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "junit-*.xml"))):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      name = "%s::%s" % (case.get("classname"), case.get("name"))
                      head = (bad.get("message") or bad.tag).splitlines()[0][:300]
                      tail = [l for l in (bad.text or "").splitlines() if l.strip()][-25:]
                      msg = "%0A".join([head] + [l.replace("%", "%25")[:240] for l in tail])
                      print("::error title=%s::%s" % (name.replace(":", "_")[:200], msg))
          PY

  core-only:
    # The toolkit alone, without the optional Assistant: it must install, reproduce its reference values and run
    # the worked examples on its own.
    name: core only (no Assistant) / ubuntu-latest / Python 3.11
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the toolkit only
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[html]"
      - name: The Assistant is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('rnplens_assistant') is not None)"
      - name: Numerical regression (portable profile)
        run: rnplens selftest --profile portable
      - name: End-to-end examples
        run: bash examples/run_examples.sh "$RUNNER_TEMP/rnplens_examples"
