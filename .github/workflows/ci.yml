name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (clean environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[html,test]"
      - name: CLI smoke tests
        run: |
          rnplens --version
          rnplens --help
          rnplens evaluate --help
          rnplens report --help
          rnplens diagnose --help
          rnplens provenance > /dev/null
      - name: Numerical regression (portable profile)
        run: rnplens selftest --profile portable
      - name: Test suite
        run: python -m pytest -q
      - name: End-to-end examples
        run: bash examples/run_examples.sh "$RUNNER_TEMP/rnplens_examples"
