[build-system]
# setuptools >= 77 implements PEP 639: the SPDX "license" expression, "license-files", and the
# License-Expression / License-File fields of core metadata 2.4 that this project declares below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rnplens"
version = "0.4.1"
description = "RNPLens: reproducible assessment of predicted protein-RNA complex structures"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
# NOTICE carries the third-party attributions that MUST accompany the two rnplens artefacts (the Mol*
# bundle and the ten attributions from eight holders embedded inside it). Naming it here puts it at
# .dist-info/licenses/NOTICE in the wheel. rnplens-assistant bundles no third-party code and does not
# carry it.
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Brian J. Parker", email = "Brian.Parker@anu.edu.au" },
  { name = "Jiayu Wen", email = "Jiayu.Wen@anu.edu.au" },
]
keywords = ["protein-RNA complex", "structure prediction", "evaluation", "DockQ", "structural biology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
# Exactly the runtime pins under which RNPLens was qualified. DockQ is pinned because the frozen scorer depends on
# DockQ 2.1.3 internals.
dependencies = [
  "DockQ==2.1.3",
  "gemmi==0.6.5",
  "biopython==1.84",
  "numpy==1.26.4",
  "scipy==1.13.1",
]

[project.optional-dependencies]
html = ["matplotlib>=3.8"]   # only for the HTML page of RNPLens Report
test = ["pytest", "jsonschema>=4.18", "setuptools>=70.1"]   # setuptools: the release-manifest tests build wheels (bdist_wheel is built in from 70.1)

[project.scripts]
rnplens = "rnplens.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
# rnplens: the public command and version. The other six import packages are internal RNPLens components whose
# module names (rnpbench_*) are historical identifiers kept for numerical reproducibility (docs/identifiers.md).
packages = ["rnplens", "rnpbench", "rnpbench_core", "rnpbench_evaluate", "rnpbench_report", "rnpbench_diagnose"]
include-package-data = false

[tool.setuptools.package-data]
rnplens = ["vendor/molstar/*", "viewer_assets/*"]   # vendored Mol* viewer (MIT; see src/rnplens/vendor/molstar/VERSION.json) and the RNPLens contact explorer script
rnpbench = ["profiles/*.json", "expected/*.json", "expected/*.md", "expected/*.txt", "examples/*.md", "examples/*/*.json", "examples/*/*.pdb", "examples/*/*/*"]
rnpbench_core = ["frozen/*.json", "frozen/*/*.py"]
rnpbench_evaluate = ["fixtures/*.json", "fixtures/*/*", "profiles/*.json"]
rnpbench_report = ["selftest_data/*/*.json", "selftest_data/*/*.html", "selftest_data/*/*/*", "selftest_data/README.md"]
rnpbench_diagnose = ["reference/*", "_checks/contract/*.py"]

[tool.pytest.ini_options]
markers = ["karyon: needs development data present only on the karyon host (skipped elsewhere)"]
testpaths = ["tests"]
