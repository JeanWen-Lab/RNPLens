[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rnplens"
version = "0.2.0rc2"
description = "RNPLens: evaluation and diagnostic tools for protein-RNA complex predictions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "RNPLens authors (author list to be supplied)" }]
keywords = ["protein-RNA complex", "structure prediction", "evaluation", "DockQ", "structural biology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
# Exactly the runtime pins under which RNPLens was qualified. DockQ is pinned because the frozen scorer depends on
# DockQ 2.1.3 internals.
dependencies = [
  "DockQ==2.1.3",
  "gemmi==0.6.5",
  "biopython==1.84",
  "numpy==1.26.4",
  "scipy==1.13.1",
]

[project.optional-dependencies]
html = ["matplotlib>=3.8"]   # only for the HTML page of RNPLens Report
test = ["pytest"]

[project.scripts]
rnplens = "rnplens.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
# rnplens: the public command and version. The other six import packages are internal RNPLens components whose
# module names (rnpbench_*) are historical identifiers kept for numerical reproducibility (docs/identifiers.md).
packages = ["rnplens", "rnpbench", "rnpbench_core", "rnpbench_evaluate", "rnpbench_report", "rnpbench_predict", "rnpbench_diagnose"]
include-package-data = false

[tool.setuptools.package-data]
rnpbench = ["profiles/*.json", "expected/*.json", "expected/*.md", "expected/*.txt", "examples/*.md", "examples/*/*.json", "examples/*/*.pdb", "examples/*/*/*"]
rnpbench_core = ["frozen/*.json", "frozen/*/*.py"]
rnpbench_evaluate = ["fixtures/*.json", "fixtures/*/*", "profiles/*.json"]
rnpbench_report = ["selftest_data/*/*.json", "selftest_data/*/*.html", "selftest_data/*/*/*", "selftest_data/README.md"]
rnpbench_diagnose = ["reference/*", "_checks/contract/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
